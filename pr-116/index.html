  <!-- Versões novas chegam logo (2026-10-17): o service worker antigo do
       Flutter guardava a app em cache e o telemóvel continuava com a
       versão anterior. Remove-o (e as caches dele) uma vez e recarrega. -->
  <script>
    (function () {
      try {
        if (!('serviceWorker' in navigator)) return;
        navigator.serviceWorker.getRegistrations().then(function (regs) {
          if (!regs.length) return;
          Promise.all(regs.map(function (r) { return r.unregister(); }))
            .then(function () {
              return window.caches ? caches.keys().then(function (keys) {
                return Promise.all(keys.map(function (k) { return caches.delete(k); }));
              }) : null;
            })
            .then(function () {
              try {
                if (sessionStorage.getItem('tt-sw-reset')) return;
                sessionStorage.setItem('tt-sw-reset', '1');
              } catch (e) {}
              location.reload();
            });
        });
      } catch (e) {}
    })();
  </script>

  <style>
    html, body {

    }
    /* Início 1 · Abertura — igual ao canvas, feita pela própria página
       para correr logo ao abrir, mesmo enquanto a app ainda carrega.
       As palavras brindam (1,6 s), fica a frase; quando a app está pronta
       (e passaram pelo menos 3,2 s) o verde fecha em círculo e rebenta em

    html.tt-opening, html.tt-opening body { background: #4F6B4A; }
    @font-face { font-family: TT; src: url('assets/assets/fonts/louis_george_cafe/LouisGeorgeCafe-Bold.ttf'); font-weight: 700; }
    #tt-splash { position: fixed; inset: 0; background: #4F6B4A; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 18px; z-index: 10; font-family: TT, Roboto, sans-serif; color: #fff;
      clip-path: circle(75% at 50% 50%); }
    #tt-splash .wrap { position: relative; display: inline-block; font-size: 56px; line-height: 52px; font-weight: 700; letter-spacing: -0.5px; text-align: center; }
    #tt-splash .w { display: block; }
    #tt-splash .a { animation: ttA 1.6s cubic-bezier(.2,.8,.2,1) both; }
    #tt-splash .b { animation: ttB 1.6s cubic-bezier(.2,.8,.2,1) both; }
    #tt-splash .sp { position: absolute; left: 50%; top: 50%; width: 7px; height: 7px; margin: -3.5px; border-radius: 9px; background: #F2D98D;
      opacity: 0; animation: ttSpark 1.05s ease-out 1.05s both; }
    #tt-splash .star { position: absolute; left: 50%; top: 50%; width: 26px; height: 26px; margin: -13px; opacity: 0; animation: ttStar .85s ease-out 1.05s both; }
    #tt-splash .t { font-size: 15px; color: #DDE5D3; animation: ttT .5s ease-out 1.6s both; }
    #tt-splash .prep { position: absolute; bottom: 48px; font-size: 13px; color: #DDE5D3; animation: ttT .5s ease-out 1.6s both; }
    @keyframes ttA { 0% { transform: translateX(-170px) rotate(-12deg); opacity: 0 } 69% { transform: translateX(8px) rotate(4deg); opacity: 1 } 84% { transform: translateX(-3px) rotate(-1deg) } 100% { transform: none; opacity: 1 } }
    @keyframes ttB { 0% { transform: translateX(170px) rotate(12deg); opacity: 0 } 69% { transform: translateX(-8px) rotate(-4deg); opacity: 1 } 84% { transform: translateX(3px) rotate(1deg) } 100% { transform: none; opacity: 1 } }
    @keyframes ttSpark { 0% { transform: translate(0,0) scale(0); opacity: 0 } 19% { transform: translate(0,0) scale(1); opacity: 1 } 100% { transform: translate(var(--dx),var(--dy)) scale(.3); opacity: 0 } }
    @keyframes ttStar { 0% { transform: scale(0) rotate(0); opacity: 0 } 29% { transform: scale(1.25) rotate(45deg); opacity: 1 } 100% { transform: scale(0) rotate(90deg); opacity: 0 } }
    @keyframes ttT { from { opacity: 0; transform: translateY(8px) } to { opacity: 1; transform: none } }
    #tt-splash .prep b { font-weight: inherit; opacity: 0; animation: ttDot 1.2s steps(1) infinite; }
    #tt-splash .prep .d2 { animation-name: ttDot2; }
    #tt-splash .prep .d3 { animation-name: ttDot3; }
    @keyframes ttDot { 0% { opacity: 0 } 25%, 100% { opacity: 1 } }
    @keyframes ttDot2 { 0%, 25% { opacity: 0 } 50%, 100% { opacity: 1 } }
    @keyframes ttDot3 { 0%, 50% { opacity: 0 } 75%, 100% { opacity: 1 } }
    /* saída */
    #tt-splash.go { animation: ttExit .7s cubic-bezier(.7,0,.3,1) both; }
    #tt-splash.go .wrap, #tt-splash.go .t, #tt-splash.go .prep { animation: ttLift .5s ease-in both; }
    @keyframes ttExit { from { clip-path: circle(75% at 50% 50%) } to { clip-path: circle(0% at 50% 50%) } }
    @keyframes ttLift { from { opacity: 1; transform: none } to { opacity: 0; transform: translateY(-40px) } }
    #tt-cf { position: fixed; inset: 0; pointer-events: none; z-index: 11; }
    #tt-cf i { position: absolute; left: 50%; top: 50%; width: 8px; height: 13px; border-radius: 2px; opacity: 0; }
    #tt-cf.go i { animation: ttBurst 1.15s cubic-bezier(.15,.7,.3,1) .65s both; }
    @keyframes ttBurst { 0% { transform: translate(-50%,-50%) scale(0); opacity: 0 } 9% { transform: translate(-50%,-50%) scale(1); opacity: 1 }
      52% { transform: translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) rotate(var(--r)); opacity: 1 }
      100% { transform: translate(calc(-50% + var(--dx)*1.1),calc(-50% + var(--dy) + 90px)) rotate(calc(var(--r)*1.6)); opacity: 0 } }
    /* Ecrã sempre na vertical (2026-10-19): o iPhone não deixa a web
       travar a rotação, por isso num telemóvel deitado aparece este aviso
       por cima da app até voltar à vertical. */
    #tt-rotate { display: none; }
    @media (orientation: landscape) and (max-height: 520px) and (pointer: coarse) {
      #tt-rotate { display: flex; position: fixed; inset: 0; z-index: 20; background: #4F6B4A; color: #fff;
        flex-direction: column; align-items: center; justify-content: center; gap: 14px; text-align: center;

      #tt-rotate svg { animation: ttRot 1.8s ease-in-out infinite; }
      #tt-rotate b { font-size: 22px; }
      #tt-rotate span { font-size: 14px; color: #DDE5D3; }
    }
    @keyframes ttRot { 0%, 20% { transform: rotate(-90deg) } 60%, 100% { transform: rotate(0deg) } }

  <script>
    // Android/PWA instalada: tenta travar mesmo a rotação (o iPhone não
    // deixa — aí fica o aviso acima).
    (function () {
      function lock() {
        try {
          if (screen.orientation && screen.orientation.lock) {
            screen.orientation.lock('portrait').catch(function () {});
          }
        } catch (e) {}
      }
      lock();
      window.addEventListener('pointerdown', lock, { once: true });
    })();
    // A app muda a cor da barra do topo conforme o fundo da página.
    // Enquanto a abertura verde cobre o ecrã, a app pode pedir outra cor
    // (o primeiro ecrã desenha-se por baixo): guarda-a e só a aplica
    // quando o círculo verde deixa de cobrir o topo (2026-10-19 — antes o
    // topo ficava branco por cima do verde).
    window.tchinOpening = true;
    window.tchinPendingBar = null;
    window.tchinSetThemeColor = function (c) {
      if (window.tchinOpening) { window.tchinPendingBar = c; return; }
      var m = document.querySelector('meta[name="theme-color"]');
      if (m) m.setAttribute('content', c);
      // Safari 26 (iOS) já não usa o theme-color: pinta a barra do topo
      // com o fundo da página. Por isso o fundo do html/body acompanha a
      // cor (verde no brinde, branco no resto) — 2026-10-18.
      document.documentElement.style.background = c;
      document.body.style.background = c;
    };
    (function () {
      var colors = ['#4F6B4A', '#F2D98D', '#F3C9CF', '#A9BC8F', '#E8B44C', '#DDE5D3', '#F3B9C1'];
      var cf = document.getElementById('tt-cf');
      for (var i = 0; i < 30; i++) {
        var a = i / 30 * Math.PI * 2, d = 110 + (i * 37 % 100);
        var el = document.createElement('i');
        el.style.setProperty('--dx', Math.round(Math.cos(a) * d) + 'px');
        el.style.setProperty('--dy', Math.round(Math.sin(a) * d) + 'px');
        el.style.setProperty('--r', ((i % 2 ? -1 : 1) * (180 + i * 17)) + 'deg');
        el.style.background = colors[i % colors.length];
        if (i % 4 === 0) { el.style.width = '8px'; el.style.height = '8px'; el.style.borderRadius = '9px'; }
        cf.appendChild(el);
      }
      var t0 = Date.now(), ready = false, gone = false;
      function exit() {
        if (gone || !ready || Date.now() - t0 < 3200) return;
        gone = true;
        var sp = document.getElementById('tt-splash');
        sp.classList.add('go');
        cf.classList.add('go');
        // Instante exato em que o círculo (75% → 0, cubic-bezier(.7,0,.3,1),
        // 0,7 s) deixa de cobrir o topo do ecrã.
        var w = innerWidth, h = innerHeight, R = Math.sqrt(w * w + h * h) / Math.SQRT2;
        var target = Math.min(1, Math.max(0, 1 - h / (1.5 * R)));
        function bz(t, a, b) { var u = 1 - t; return 3 * u * u * t * a + 3 * u * t * t * b + t * t * t; }
        var lo = 0, hi = 1;
        for (var k = 0; k < 30; k++) { var mid = (lo + hi) / 2; if (bz(mid, 0, 1) < target) lo = mid; else hi = mid; }
        var px = bz(lo, 0.7, 0.3);
        setTimeout(function () {
          window.tchinOpening = false;
          document.documentElement.classList.remove('tt-opening');
          window.tchinSetThemeColor(window.tchinPendingBar || '#FFFFFF');
        }, Math.round(700 * px));
        setTimeout(function () { sp.remove(); }, 750);
        setTimeout(function () { cf.remove(); }, 2000);
      }
      window.addEventListener('flutter-first-frame', function () {
        // um instante para o primeiro ecrã ficar desenhado por baixo
        setTimeout(function () { ready = true; exit(); }, 250);
      });
      setTimeout(exit, 3200);
      // segurança: nunca fica preso na abertura
      setTimeout(function () { ready = true; exit(); }, 12000);
    })();
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script>
    // Pagamento dentro da app (2026-10-19): Payment Element da Stripe
    // montado num platform view do Flutter — o formulário é um iframe da
    // própria Stripe (nada de cartões passa pela app) e nunca se abre o
    // browser. Stripe.js só é carregado quando se chega ao pagamento.
    window.tchinPay = (function () {
      var stripe = null, key = null, elements = null, pe = null, ro = null;
      function load() {
        return new Promise(function (res, rej) {
          if (window.Stripe) return res();
          var s = document.createElement('script');
          s.src = 'https://js.stripe.com/v3/';
          s.onload = function () { res(); };
          s.onerror = function () { rej(new Error('stripe_js')); };
          document.head.appendChild(s);
        });
      }
      function clean() {
        if (ro) { ro.disconnect(); ro = null; }
        if (pe) { try { pe.destroy(); } catch (e) {} pe = null; }
        elements = null;
      }
      return {
        createHost: function () {
          var d = document.createElement('div');
          d.style.width = '100%'; d.style.height = '100%'; d.style.overflow = 'hidden';
          return d;
        },
        mount: function (host, pk, secret, email, onHeight, onEvent) {
          return load().then(function () {
            if (!stripe || key !== pk) { stripe = window.Stripe(pk, { locale: 'pt' }); key = pk; }
            clean();
            elements = stripe.elements({
              clientSecret: secret,
              appearance: {
                theme: 'stripe',
                variables: {
                  colorPrimary: '#4F6B4A', colorText: '#171713', colorTextSecondary: '#57534E',
                  colorBackground: '#FFFFFF', colorDanger: '#B3261E', borderRadius: '14px',
                  fontFamily: '-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif',
                  fontSizeBase: '15px', spacingUnit: '4px'
                },
                rules: {
                  '.Input': { border: '1px solid #E6E0D2', boxShadow: 'none', padding: '13px 14px' },
                  '.Input:focus': { border: '1px solid #4F6B4A', boxShadow: '0 0 0 3px rgba(79,107,74,.15)' },
                  '.Label': { fontWeight: '600' },
                  '.Tab': { border: '1px solid #E6E0D2', boxShadow: 'none' },
                  '.Tab--selected': { border: '1.5px solid #4F6B4A' }
                }
              }
            });
            pe = elements.create('payment', {
              layout: 'tabs',
              business: { name: 'À Nossa!' },
              defaultValues: { billingDetails: { email: email || undefined } },
              wallets: { applePay: 'auto', googlePay: 'auto' }
            });
            pe.on('ready', function () { onEvent('ready'); });
            pe.on('change', function (e) { onEvent(e.complete ? 'complete' : 'incomplete'); });
            pe.on('loaderror', function () { onEvent('loaderror'); });
            host.innerHTML = '';
            var inner = document.createElement('div');
            inner.style.padding = '2px 2px 6px';
            host.appendChild(inner);
            pe.mount(inner);
            ro = new ResizeObserver(function () { onHeight(Math.ceil(inner.getBoundingClientRect().height)); });
            ro.observe(inner);
            return 'ok';
          });
        },
        confirm: function () {
          if (!stripe || !elements) return Promise.resolve(JSON.stringify({ error: 'Formulário não carregado.' }));
          return elements.submit().then(function (r) {
            if (r.error) return JSON.stringify({ error: r.error.message || 'Dados em falta.' });
            return stripe.confirmPayment({
              elements: elements,
              redirect: 'if_required',
              confirmParams: { return_url: location.href }
            }).then(function (res) {
              if (res.error) return JSON.stringify({ error: res.error.message || 'Pagamento recusado.', code: res.error.code || null });
              var pi = res.paymentIntent || {};
              var mb = pi.next_action && pi.next_action.multibanco_display_details;
              return JSON.stringify({
                status: pi.status || null,
                multibanco: mb ? { entity: mb.entity, reference: mb.reference, expires_at: mb.expires_at } : null
              });
            });
          }).catch(function (e) { return JSON.stringify({ error: (e && e.message) || 'Pagamento falhou.' }); });
        },
        unmount: clean
      };
    })();
  </script>
  <script>
    // Conta Stripe do parceiro dentro da app (2026-10-19): componente
    // embutido de onboarding do Stripe Connect num platform view. O
    // formulário (identidade, morada, IBAN) é da Stripe; os dados vão
    // diretamente para a Stripe.
    window.tchinConnect = (function () {
      var el = null, ro = null;
      function load() {
        return new Promise(function (res, rej) {
          if (window.StripeConnect && window.StripeConnect.init) return res();
          var s = document.createElement('script');
          s.src = 'https://connect-js.stripe.com/v1.0/connect.js';
          s.onload = function () {
            if (window.StripeConnect && window.StripeConnect.init) return res();
            window.StripeConnect = window.StripeConnect || {};
            window.StripeConnect.onLoad = function () { res(); };
          };
          s.onerror = function () { rej(new Error('connect_js')); };
          document.head.appendChild(s);
        });
      }
      function clean() {
        if (ro) { ro.disconnect(); ro = null; }
        if (el && el.parentNode) el.parentNode.removeChild(el);
        el = null;
      }
      return {
        createHost: function () {
          var d = document.createElement('div');
          d.style.width = '100%'; d.style.height = '100%'; d.style.overflow = 'auto';
          return d;
        },
        mountOnboarding: function (host, pk, firstSecret, fnUrl, anon, token, onHeight, onEvent) {
          return load().then(function () {
            clean();
            var used = false;
            var instance = window.StripeConnect.init({
              publishableKey: pk,
              locale: 'pt-PT',
              fetchClientSecret: function () {
                if (!used) { used = true; return Promise.resolve(firstSecret); }
                return fetch(fnUrl, {
                  method: 'POST',
                  headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token, 'apikey': anon },
                  body: JSON.stringify({ action: 'session' })
                }).then(function (r) { return r.json(); }).then(function (j) { return j.client_secret; });
              },
              appearance: {
                overlays: 'dialog',
                variables: {
                  colorPrimary: '#4F6B4A', colorText: '#171713', colorSecondaryText: '#57534E',
                  colorBackground: '#FFFFFF', colorBorder: '#E6E0D2', colorDanger: '#B3261E',
                  borderRadius: '14px', buttonBorderRadius: '999px', formBorderRadius: '14px',
                  fontFamily: '-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif',
                  fontSizeBase: '15px', spacingUnit: '10px',
                  buttonPrimaryColorBackground: '#4F6B4A', buttonPrimaryColorText: '#FFFFFF'
                }
              }
            });
            el = instance.create('account-onboarding');
            try { el.setCollectionOptions({ fields: 'eventually_due', futureRequirements: 'include' }); } catch (e) {}
            el.setOnExit(function () { onEvent('exit'); });
            try { el.setOnLoadError(function () { onEvent('loaderror'); }); } catch (e) {}
            try { el.setOnLoaderStart(function () { onEvent('ready'); }); } catch (e) { onEvent('ready'); }
            host.innerHTML = '';
            host.appendChild(el);
            ro = new ResizeObserver(function () { onHeight(Math.ceil(el.getBoundingClientRect().height)); });
            ro.observe(el);
            return 'ok';
          });
        },
        unmount: clean
      };
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
