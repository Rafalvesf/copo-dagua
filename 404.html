<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/copo-dagua/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Tchin Tchin — o teu evento, num só lugar.">

  <!-- iOS meta tags & icons -->
  <meta name="theme-color" content="#FFFFFF">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Tchin Tchin">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Tchin Tchin</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      overscroll-behavior: none;
      /* Igual ao fundo da app — antes era #D1D4DA (cinzento-azulado),
         que aparecia como uma barra azulada no topo no telemóvel. */
      background: #FFFFFF;
    }
    /* Início 1 · Abertura — aparece logo ao abrir, enquanto a app
       carrega (pedido 2026-10-17: "a abertura nem chega a aparecer").
       Quando a app desenha o primeiro ecrã, continua o brinde e sai em
       círculo. */
    @font-face { font-family: TT; src: url('assets/assets/fonts/louis_george_cafe/LouisGeorgeCafe-Bold.ttf'); font-weight: 700; }
    #tt-splash { position: fixed; inset: 0; background: #5F7545; display: flex; flex-direction: column;
      align-items: center; justify-content: center; z-index: 10; font-family: TT, Roboto, sans-serif; color: #fff; }
    #tt-splash .w { font-size: 56px; line-height: 52px; font-weight: 700; letter-spacing: -0.5px; display: block; text-align: center; }
    #tt-splash .a { animation: ttA 1.6s cubic-bezier(.2,.8,.2,1) both; }
    #tt-splash .b { animation: ttB 1.6s cubic-bezier(.2,.8,.2,1) both; }
    #tt-splash .t { margin-top: 14px; font-size: 15px; color: #DDE5D3; animation: ttT .5s ease-out 1.6s both; }
    @keyframes ttA { 0% { transform: translateX(-170px) rotate(-12deg); opacity: 0 } 69% { transform: translateX(8px) rotate(4deg); opacity: 1 } 84% { transform: translateX(-3px) rotate(-1deg) } 100% { transform: none } }
    @keyframes ttB { 0% { transform: translateX(170px) rotate(12deg); opacity: 0 } 69% { transform: translateX(-8px) rotate(-4deg); opacity: 1 } 84% { transform: translateX(3px) rotate(1deg) } 100% { transform: none } }
    @keyframes ttT { from { opacity: 0; transform: translateY(8px) } to { opacity: 1; transform: none } }
  </style>
</head>
<body>
  <div id="tt-splash" aria-label="Tchin Tchin">
    <span class="w a">Tchin</span><span class="w b">Tchin</span>
    <span class="t">Para todas as festas</span>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var el = document.getElementById('tt-splash');
      if (el) el.remove();
    });
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
