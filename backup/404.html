              }).catch(function (e) { try { ev.complete('fail'); } catch (x) {} finish(JSON.stringify({ error: (e && e.message) || 'Pagamento falhou.' })); });
            });
            try { pr.show(); } catch (e) { finish(JSON.stringify({ error: 'Não foi possível abrir a janela de pagamento.' })); }
          });
        },
        unmount: destroyCard
      };
    })();
  </script>
  <script>
    // Notificações com a app fechada (Web Push, 2026-10-21). O pedido de
    // permissão tem de vir de um toque do utilizador (botão na app).
    // Câmara (passo de permissões do registo, 2026-10-25): pede e fecha
    // logo a câmara, só para ficar autorizada.
    window.tchinCamera = {
      status: function () {
        if (!navigator.permissions || !navigator.permissions.query) return Promise.resolve('prompt');
        return navigator.permissions.query({ name: 'camera' })
          .then(function (r) { return r.state; })
          .catch(function () { return 'prompt'; });
      },
      request: function () {
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return Promise.resolve('unsupported');
        return navigator.mediaDevices.getUserMedia({ video: true })
          .then(function (stream) { stream.getTracks().forEach(function (t) { t.stop(); }); return 'granted'; })
          .catch(function (e) { return (e && e.name === 'NotFoundError') ? 'unsupported' : 'denied'; });
      }
    };
    window.tchinPush = (function () {
      function b64ToBytes(b64) {
        var pad = '='.repeat((4 - b64.length % 4) % 4);
        var raw = atob((b64 + pad).replace(/-/g, '+').replace(/_/g, '/'));
        var out = new Uint8Array(raw.length);
        for (var i = 0; i < raw.length; i++) out[i] = raw.charCodeAt(i);
        return out;
      }
      function supported() {
        return 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window;
      }
      function standalone() {
        return (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) || navigator.standalone === true;
      }
      function ios() { return /iphone|ipad|ipod/i.test(navigator.userAgent); }
      function reg() { return navigator.serviceWorker.register('push_sw.js'); }
      return {
        status: function () {
          if (!supported()) return ios() && !standalone() ? 'ios_install' : 'unsupported';
          return Notification.permission; // granted | denied | default
        },
        subscribe: function (publicKey) {
          if (!supported()) return Promise.resolve(JSON.stringify({ error: 'unsupported' }));
          return Notification.requestPermission().then(function (perm) {
            if (perm !== 'granted') return JSON.stringify({ error: perm });
            return reg().then(function (r) { return navigator.serviceWorker.ready.then(function () { return r; }); })
              .then(function (r) {
                return r.pushManager.getSubscription().then(function (sub) {
                  return sub || r.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64ToBytes(publicKey) });
                });
              })
              .then(function (sub) { return JSON.stringify(sub.toJSON()); });
          }).catch(function (e) { return JSON.stringify({ error: (e && e.message) || 'failed' }); });
        },
        current: function () {
          if (!supported() || Notification.permission !== 'granted') return Promise.resolve('');
          return reg().then(function (r) { return r.pushManager.getSubscription(); })
            .then(function (sub) { return sub ? JSON.stringify(sub.toJSON()) : ''; })
            .catch(function () { return ''; });
        },
        unsubscribe: function () {
          if (!supported()) return Promise.resolve('');
          return navigator.serviceWorker.getRegistration().then(function (r) {
            return r ? r.pushManager.getSubscription() : null;
          }).then(function (sub) {
            if (!sub) return '';
            var ep = sub.endpoint;
            return sub.unsubscribe().then(function () { return ep; });
          }).catch(function () { return ''; });
        }
      };
    })();
  </script>
  <script>
    // Conta Stripe do parceiro dentro da app (2026-10-19): componente
    // embutido de onboarding do Stripe Connect num platform view. O
    // formulário (identidade, morada, IBAN) é da Stripe; os dados vão
    // diretamente para a Stripe.
    window.tchinConnect = (function () {
      var el = null, ro = null;
      function load() {
        return new Promise(function (res, rej) {
          if (window.StripeConnect && window.StripeConnect.init) return res();
          var s = document.createElement('script');
          s.src = 'https://connect-js.stripe.com/v1.0/connect.js';
          s.onload = function () {
            if (window.StripeConnect && window.StripeConnect.init) return res();
            window.StripeConnect = window.StripeConnect || {};
            window.StripeConnect.onLoad = function () { res(); };
          };
          s.onerror = function () { rej(new Error('connect_js')); };
          document.head.appendChild(s);
        });
      }
      function clean() {
        if (ro) { ro.disconnect(); ro = null; }
        if (el && el.parentNode) el.parentNode.removeChild(el);
        el = null;
      }
      return {
        createHost: function () {
          var d = document.createElement('div');
          d.style.width = '100%'; d.style.height = '100%'; d.style.overflow = 'auto';
          return d;
        },
        mountOnboarding: function (host, pk, firstSecret, fnUrl, anon, token, onHeight, onEvent) {
          return load().then(function () {
            clean();
            var used = false;
            var instance = window.StripeConnect.init({
              publishableKey: pk,
              locale: 'pt-PT',
              fetchClientSecret: function () {
                if (!used) { used = true; return Promise.resolve(firstSecret); }
                return fetch(fnUrl, {
                  method: 'POST',
                  headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token, 'apikey': anon },
                  body: JSON.stringify({ action: 'session' })
                }).then(function (r) { return r.json(); }).then(function (j) { return j.client_secret; });
              },
              appearance: {
                overlays: 'dialog',
                variables: {
                  colorPrimary: '#4F6B4A', colorText: '#171713', colorSecondaryText: '#57534E',
                  colorBackground: '#FFFFFF', colorBorder: '#E6E0D2', colorDanger: '#B3261E',
                  borderRadius: '14px', buttonBorderRadius: '999px', formBorderRadius: '14px',
                  fontFamily: '-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif',
                  fontSizeBase: '15px', spacingUnit: '10px',
                  buttonPrimaryColorBackground: '#4F6B4A', buttonPrimaryColorText: '#FFFFFF'
                }
              }
            });
            el = instance.create('account-onboarding');
            try { el.setCollectionOptions({ fields: 'eventually_due', futureRequirements: 'include' }); } catch (e) {}
            el.setOnExit(function () { onEvent('exit'); });
            try { el.setOnLoadError(function () { onEvent('loaderror'); }); } catch (e) {}
            try { el.setOnLoaderStart(function () { onEvent('ready'); }); } catch (e) { onEvent('ready'); }
            host.innerHTML = '';
            host.appendChild(el);
            ro = new ResizeObserver(function () { onHeight(Math.ceil(el.getBoundingClientRect().height)); });
            ro.observe(el);
            return 'ok';
          });
        },
        unmount: clean
      };
    })();
  </script>
