name: App screenshots

# Gera capturas de todos os ecrãs (casal, parceiro, convidado) com dados
# de exemplo — ver mobile-app/app/test/screenshots/app_screens_test.dart.
# As imagens ficam no artefacto "app-screenshots" desta execução.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'mobile-app/app/lib/**'
      - 'mobile-app/app/test/screenshots/**'
      - '.github/workflows/app-screenshots.yml'

concurrency:
  group: app-screenshots-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  screenshots:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile-app/app
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Capture screens
        run: |
          set -o pipefail
          flutter test --update-goldens --tags screenshots test/screenshots 2>&1 | tee screenshots.log || echo "failed" > screenshots.failed
          flutter test --exclude-tags screenshots > tests.log 2>&1 || true

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-screenshots
          path: |
            mobile-app/app/test/screenshots/goldens/*.png
            mobile-app/app/screenshots.log
          if-no-files-found: warn

      # Também num ramo `screenshots` (sobrescrito a cada execução), para
      # se poderem ver/descarregar sem passar pelos artefactos.
      - name: Publish to screenshots branch
        if: always()
        run: |
          out=$(mktemp -d)
          mkdir -p "$out/png"
          cp test/screenshots/goldens/*.png "$out/png/" 2>/dev/null || true
          cp screenshots.log "$out/" 2>/dev/null || true
          cp tests.log "$out/" 2>/dev/null || true
          cd "$out"
          git init -q -b screenshots
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Capturas de ${GITHUB_SHA}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" screenshots
