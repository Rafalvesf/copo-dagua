name: Mobile app PR preview

# Publica cada PR da app Flutter em
# https://rafalvesf.github.io/copo-dagua/pr-<número>/ (subpasta do gh-pages),
# para se poder ver as alterações antes do merge. O site principal
# continua a ser publicado só por deploy-gh-pages.yml a partir do master
# (que, ao publicar, limpa estas pastas de preview).
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'mobile-app/app/**'
      - '.github/workflows/mobile-preview.yml'

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: mobile-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview:
    # PRs de forks não têm permissão de escrita no gh-pages.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: mobile-app/app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build web
        run: flutter build web --release --base-href /copo-dagua/pr-${{ github.event.pull_request.number }}/

      - name: Prepare SPA fallback
        run: cp build/web/index.html build/web/404.html

      - name: Deploy preview to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: mobile-app/app/build/web
          destination_dir: pr-${{ github.event.pull_request.number }}
          keep_files: false
          enable_jekyll: false

      - name: Comment preview URL
        uses: actions/github-script@v7
        with:
          script: |
            const url = `https://rafalvesf.github.io/copo-dagua/pr-${context.issue.number}/`;
            const marker = '<!-- mobile-preview -->';
            const { data: comments } = await github.rest.issues.listComments({
              ...context.repo, issue_number: context.issue.number,
            });
            const body = `${marker}\n📱 Preview da app: ${url}\n\nCommit: ${context.sha.slice(0, 7)}`;
            const existing = comments.find(c => c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });
            }
