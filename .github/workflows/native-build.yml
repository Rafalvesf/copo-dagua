name: Native build (Android + iOS)

# Confirma que a app compila em Android e iOS (sem assinatura). Os
# builds para as lojas (assinados) ficam para um workflow próprio quando
# houver as contas Apple Developer e Google Play.
on:
  pull_request:
    paths:
      - 'mobile-app/app/**'
      - '.github/workflows/native-build.yml'
  push:
    branches:
      - master
    paths:
      - 'mobile-app/app/**'
      - '.github/workflows/native-build.yml'
  workflow_dispatch:

concurrency:
  group: native-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile-app/app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build APK
        run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: a-nossa-android-debug
          path: mobile-app/app/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7

  ios:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: mobile-app/app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build iOS (sem assinatura)
        run: flutter build ios --debug --no-codesign
