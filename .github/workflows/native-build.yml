name: Native build (Android + iOS)

# Confirma que a app compila em Android e iOS (sem assinatura). Os
# builds para as lojas (assinados) ficam para um workflow próprio quando
# houver as contas Apple Developer e Google Play.
on:
  pull_request:
    paths:
      - 'mobile-app/app/**'
      - '.github/workflows/native-build.yml'
  push:
    branches:
      - master
    paths:
      - 'mobile-app/app/**'
      - '.github/workflows/native-build.yml'
  workflow_dispatch:

concurrency:
  group: native-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile-app/app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: pub get
        run: |
          set -o pipefail
          flutter pub get 2>&1 | tee build.txt || {
            grep -iE "error|exception|failed|what went wrong|because|incompatible|requires|symbol|location:|plugin" build.txt | grep -v "^\s*at " | tail -40 | while read -r line; do echo "::error::$line"; done
            exit 1
          }
      - name: Build APK
        env:
          # Chave Firebase vem dos segredos do repositório (nunca no código).
          FIREBASE_ANDROID_API_KEY: ${{ secrets.FIREBASE_ANDROID_API_KEY }}
        run: |
          set -o pipefail
          flutter build apk --debug --dart-define=FIREBASE_ANDROID_API_KEY="$FIREBASE_ANDROID_API_KEY" 2>&1 | tee build.txt || {
            grep -iE "error|exception|failed|what went wrong|because|incompatible|requires|symbol|location:|plugin" build.txt | grep -v "^\s*at " | tail -40 | while read -r line; do echo "::error::$line"; done
            exit 1
          }
      - uses: actions/upload-artifact@v4
        with:
          name: a-nossa-android-debug
          path: mobile-app/app/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7

  ios:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: mobile-app/app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: pub get
        run: |
          set -o pipefail
          flutter pub get 2>&1 | tee build.txt || {
            grep -iE "error|exception|failed|what went wrong|because|incompatible|requires|symbol|location:|plugin" build.txt | grep -v "^\s*at " | tail -40 | while read -r line; do echo "::error::$line"; done
            exit 1
          }
      - name: Build iOS (sem assinatura)
        env:
          FIREBASE_IOS_API_KEY: ${{ secrets.FIREBASE_IOS_API_KEY }}
        run: |
          set -o pipefail
          flutter build ios --debug --no-codesign --dart-define=FIREBASE_IOS_API_KEY="$FIREBASE_IOS_API_KEY" 2>&1 | tee build.txt || {
            grep -iE "error|exception|failed|what went wrong|because|incompatible|requires|symbol|location:|plugin" build.txt | grep -v "^\s*at " | tail -40 | while read -r line; do echo "::error::$line"; done
            exit 1
          }
