name: tmp event photos
on:
  push:
    branches: [tmp-fotos-eventos]
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install pillow
      - run: python scripts/event_photos/fetch.py
      - uses: actions/upload-artifact@v4
        with:
          name: fotos
          path: out/
