name: tmp event photos
on:
  push:
    branches: [tmp-fotos-eventos]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install pillow
      - run: python scripts/event_photos/fetch.py
      - run: |
          mkdir -p mobile-app/app/web/eventos
          cp out/*.jpg mobile-app/app/web/eventos/
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add mobile-app/app/web/eventos
          git commit -m "Fotos dos eventos reais (Wikimedia Commons)"
          git push
